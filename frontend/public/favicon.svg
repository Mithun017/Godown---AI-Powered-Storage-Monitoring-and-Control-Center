<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(56,189,248,0.3)" stroke-width="8" />

  <!-- Warehouse Building Structural Outline -->
  <g filter="url(#glow)">
    <!-- Roof Peak -->
    <path d="M 256 96 L 416 192 L 416 224 L 256 128 L 96 224 L 96 192 Z" fill="url(#roofGrad)" />
    
    <!-- Main Body -->
    <rect x="112" y="216" width="288" height="200" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="url(#cyanGrad)" stroke-width="12" />

    <!-- Storage Rollup Door Grid -->
    <rect x="192" y="272" width="128" height="144" rx="8" fill="rgba(14, 165, 233, 0.15)" stroke="url(#cyanGrad)" stroke-width="8" />
    <line x1="192" y1="304" x2="320" y2="304" stroke="url(#cyanGrad)" stroke-width="6" />
    <line x1="192" y1="336" x2="320" y2="336" stroke="url(#cyanGrad)" stroke-width="6" />
    <line x1="192" y1="368" x2="320" y2="368" stroke="url(#cyanGrad)" stroke-width="6" />

    <!-- Live Telemetry Pulse Node -->
    <circle cx="256" cy="176" r="20" fill="url(#emeraldGrad)" />
    <circle cx="256" cy="176" r="32" fill="none" stroke="#34D399" stroke-width="6" opacity="0.6" />
    
    <!-- Wireless Signal Waves -->
    <path d="M 216 156 A 48 48 0 0 1 296 156" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 200 140 A 72 72 0 0 1 312 140" fill="none" stroke="url(#cyanGrad)" stroke-width="8" opacity="0.6" stroke-linecap="round" />
  </g>
</svg>